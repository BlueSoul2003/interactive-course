<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Securely open a Mastery Academy learning module.">
  <meta name="color-scheme" content="light">
  <title>Open Course | Mastery Academy</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #172033;
      --muted: #62708a;
      --line: #dce3ee;
      --surface: #ffffff;
      --soft: #f5f7fb;
      --brand: #2759c6;
      --brand-dark: #1d459d;
      --danger: #a33232;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: linear-gradient(145deg, #f8f9fc, #eef2f8);
    }
    .shell { width: min(100%, 520px); }
    .brand { margin: 0 0 18px; color: var(--muted); font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .panel { padding: clamp(26px, 6vw, 42px); border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 22px 60px rgba(31, 47, 77, .1); }
    .eyebrow { margin: 0 0 10px; color: var(--brand); font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.12; letter-spacing: -.035em; }
    .message { margin: 14px 0 26px; color: var(--muted); line-height: 1.6; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; font-size: .86rem; font-weight: 750; }
    input { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 10px; color: var(--ink); background: #fff; font: inherit; }
    input:focus { outline: 3px solid rgba(39, 89, 198, .16); border-color: var(--brand); }
    button, .button-link { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 11px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
    button { color: #fff; background: var(--brand); }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .58; cursor: wait; }
    .secondary { color: var(--ink); background: var(--soft); border: 1px solid var(--line); }
    .secondary:hover { background: #e9eef7; }
    .actions { display: grid; gap: 10px; margin-top: 20px; }
    .status { min-height: 22px; margin: 14px 0 0; color: var(--danger); font-size: .9rem; line-height: 1.45; }
    .hidden { display: none !important; }
    .spinner { width: 30px; height: 30px; margin: 26px auto 8px; border: 3px solid #dfe6f1; border-top-color: var(--brand); border-radius: 50%; animation: spin .75s linear infinite; }
    .course-name { margin-top: 10px; padding: 12px 14px; border-left: 3px solid var(--brand); color: #36445e; background: var(--soft); font-weight: 700; }
    .help { margin: 22px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <p class="brand">Mastery Academy</p>
    <section class="panel" aria-labelledby="launcher-title">
      <p class="eyebrow">Module Launcher</p>
      <h1 id="launcher-title">Checking course access</h1>
      <div id="course-name" class="course-name hidden"></div>
      <p id="launcher-message" class="message" aria-live="polite">Please wait while we securely prepare your lesson.</p>
      <div id="loading-view">
        <div class="spinner" aria-hidden="true"></div>
      </div>

      <form id="login-form" class="hidden" novalidate>
        <label>Email
          <input id="login-email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in and continue</button>
      </form>

      <form id="pin-form" class="hidden" novalidate>
        <label>Activation PIN
          <input id="pin-code" name="pin" type="text" autocomplete="one-time-code" maxlength="64" required>
        </label>
        <button type="submit">Unlock and open course</button>
      </form>

      <p id="launcher-status" class="status" role="alert" aria-live="assertive"></p>
      <div class="actions">
        <button id="sign-out-button" class="secondary hidden" type="button">Use a different account</button>
        <a class="button-link secondary" href="index.html">Back to course portal</a>
      </div>
      <p class="help">If your PIN or account should include this course but access is denied, contact your teacher.</p>
    </section>
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/auth-access.js?v=1.1.0"></script>
  <script defer src="js/module-launcher.js?v=1.0.0"></script>
</body>
</html>
