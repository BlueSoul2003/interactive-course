<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>2025 SPM Chemistry Terengganu · Kertas 2 Teacher Slides</title>
  <style>
    /* Terengganu deep teal and copper theme */
    :root {
      --stage-bg: #061f24;
      --slide-bg: #eef6f5;
      --paper: #fffdf8;
      --ink: #0d2b30;
      --muted: #526b6c;
      --indigo: #0b5963;
      --indigo-2: #168696;
      --lavender: #d5ebeb;
      --amber: #c4873b;
      --amber-soft: #f5e6cf;
      --line: #b9d1d0;
      --danger: #b84848;
    }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Presentation chrome stays outside the slide design system */
    .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 1000;
    }

    /* 7. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .deck-controls {
            display: none !important;
        }
    }

    /* 8. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    * { box-sizing: border-box; }
    button { font: inherit; }
    body {
      font-family: "Aptos", "Trebuchet MS", sans-serif;
      color: var(--ink);
    }

    .slide-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 84px 1fr 72px;
      background:
        radial-gradient(circle at 95% 0%, rgba(227,163,58,.16), transparent 29%),
        linear-gradient(135deg, #f7f2e8 0%, #f1ecdf 100%);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 14px 30px;
      background: var(--indigo);
      color: white;
      border-bottom: 5px solid var(--amber);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .crest {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--amber);
      color: #221f46;
      font-family: "Baskerville", Georgia, serif;
      font-weight: 800;
      font-size: 23px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.32);
    }

    .brand-copy strong {
      display: block;
      font-family: "Baskerville", Georgia, serif;
      font-size: 25px;
      letter-spacing: .2px;
    }

    .brand-copy span {
      color: #d9d4ec;
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .question-title {
      text-align: center;
      font-family: "Baskerville", Georgia, serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .top-actions {
      justify-self: end;
      display: flex;
      gap: 10px;
    }

    .icon-button,
    .nav-button,
    .page-chip,
    .question-chip {
      border: 0;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
    }

    .icon-button:hover,
    .nav-button:hover,
    .page-chip:hover,
    .question-chip:hover { transform: translateY(-2px); }

    .icon-button {
      min-width: 118px;
      height: 44px;
      padding: 0 18px;
      border-radius: 13px;
      background: rgba(255,255,255,.12);
      color: white;
      border: 1px solid rgba(255,255,255,.23);
      font-weight: 750;
      font-size: 16px;
    }

    .back-link {
      display: inline-grid;
      place-items: center;
      min-width: 96px;
      height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 13px;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.2);
    }

    .icon-button.reset-all {
      background: rgba(227,163,58,.18);
      border-color: rgba(247,210,139,.48);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1120px 1fr;
      gap: 22px;
      min-height: 0;
      padding: 22px 28px 20px;
    }

    .paper-panel,
    .answer-panel {
      position: relative;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(46,42,83,.14);
      border: 1px solid rgba(44,40,100,.13);
    }

    .paper-panel {
      display: grid;
      grid-template-rows: 52px 1fr;
      background: #ded9e5;
    }

    .panel-heading {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto auto;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: #fefcf7;
      border-bottom: 1px solid var(--line);
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--indigo);
    }

    .source-label {
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pdf-tools {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pdf-tool {
      height: 34px;
      min-width: 38px;
      padding: 0 11px;
      border: 1px solid #cfcae0;
      border-radius: 10px;
      background: #f4f1f8;
      color: var(--indigo);
      cursor: pointer;
      font-size: 14px;
      font-weight: 850;
      line-height: 1;
    }

    .pdf-tool:hover {
      background: var(--lavender);
      border-color: #aaa4c7;
    }

    .pdf-tool.active {
      background: var(--indigo);
      border-color: var(--indigo);
      color: white;
    }

    .pdf-tool.zoom-readout {
      min-width: 62px;
      cursor: default;
      background: white;
      color: var(--muted);
    }

    .paper-view {
      position: static;
      display: block;
      min-height: 0;
      padding: 14px 18px 70px;
      overflow: auto;
      overscroll-behavior: contain;
      touch-action: none;
      cursor: grab;
      scrollbar-color: var(--indigo-2) #d1ccdd;
      scrollbar-width: auto;
      background:
        linear-gradient(45deg, rgba(255,255,255,.22) 25%, transparent 25%) 0 0 / 32px 32px,
        linear-gradient(-45deg, rgba(255,255,255,.22) 25%, transparent 25%) 0 16px / 32px 32px,
        #ded9e5;
    }

    .paper-view.dragging {
      cursor: grabbing;
      user-select: none;
    }

    .paper-view::-webkit-scrollbar {
      width: 16px;
      height: 16px;
    }

    .paper-view::-webkit-scrollbar-track {
      background: #d1ccdd;
    }

    .paper-view::-webkit-scrollbar-thumb {
      background: var(--indigo-2);
      border: 3px solid #d1ccdd;
      border-radius: 999px;
    }

    .paper-page {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      margin: 0 auto;
      filter: drop-shadow(0 10px 17px rgba(35,32,65,.28));
      user-select: none;
      -webkit-user-drag: none;
    }

    .paper-page.fit-page {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .page-strip {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
      padding: 7px;
      border-radius: 16px;
      background: rgba(44,40,100,.91);
      box-shadow: 0 8px 24px rgba(27,23,61,.22);
    }

    .page-chip {
      min-width: 78px;
      height: 34px;
      border-radius: 10px;
      background: transparent;
      color: #ebe8f7;
      font-size: 15px;
      font-weight: 800;
    }

    .page-chip.active {
      background: var(--amber);
      color: #221f46;
    }

    .answer-panel {
      display: grid;
      grid-template-rows: 66px 52px 1fr 112px;
      background: var(--paper);
    }

    .answer-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #fffdfa;
      border-bottom: 1px solid var(--line);
    }

    .answer-heading h2 {
      margin: 0;
      font-family: "Baskerville", Georgia, serif;
      color: var(--indigo);
      font-size: 29px;
    }

    .marks {
      padding: 8px 14px;
      border-radius: 999px;
      color: #715111;
      background: var(--amber-soft);
      font-size: 15px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      border-bottom: 1px solid #e9e4ed;
      background: #f8f5ee;
      overflow: hidden;
    }

    .progress-dot {
      flex: 1 1 0;
      height: 8px;
      border-radius: 999px;
      background: #dfdbe7;
    }

    .progress-dot.done { background: var(--indigo-2); }
    .progress-dot.current {
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(227,163,58,.17);
    }

    .reveal-stage {
      position: relative;
      min-height: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--indigo-2) #e1e8e6;
      scrollbar-width: auto;
    }

    .reveal-stage::-webkit-scrollbar {
      width: 14px;
    }

    .reveal-stage::-webkit-scrollbar-track {
      background: #e1e8e6;
    }

    .reveal-stage::-webkit-scrollbar-thumb {
      background: var(--indigo-2);
      border: 3px solid #e1e8e6;
      border-radius: 999px;
    }

    .idle-card,
    .answer-card,
    .complete-card {
      width: 100%;
      max-height: 100%;
      animation: rise .28s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .idle-card {
      text-align: center;
      padding: 52px 46px;
      border: 2px dashed #c5c0d6;
      border-radius: 24px;
      color: var(--muted);
      background: linear-gradient(145deg, #f7f7f0, #eeecf7);
    }

    .idle-icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--lavender);
      color: var(--indigo);
      font-size: 40px;
      font-weight: 900;
    }

    .idle-card strong {
      display: block;
      color: var(--indigo);
      font-family: "Baskerville", Georgia, serif;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .idle-card span {
      font-size: 20px;
      line-height: 1.55;
    }

    .answer-card {
      display: grid;
      gap: 20px;
      align-content: center;
      align-self: start;
      max-height: none;
    }

    .part-kicker {
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--indigo-2);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .part-kicker::before {
      content: "";
      width: 38px;
      height: 5px;
      border-radius: 4px;
      background: var(--amber);
    }

    .answer-box {
      padding: 25px 28px;
      border-left: 7px solid var(--indigo-2);
      border-radius: 16px;
      background: #f0eef8;
      color: #24213f;
      font-family: "Baskerville", Georgia, serif;
      font-size: 29px;
      font-weight: 700;
      line-height: 1.34;
      white-space: pre-line;
    }

    .answer-box.nuclide-answer {
      display: flex;
      min-height: 112px;
      align-items: center;
    }

    .nuclide-notation {
      display: inline-grid;
      grid-template-columns: 38px auto;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      font-family: "Cambria Math", "Times New Roman", serif;
      line-height: 1;
    }

    .nuclide-mass,
    .nuclide-proton {
      grid-column: 1;
      justify-self: end;
      padding-right: 4px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .nuclide-mass {
      grid-row: 1;
      align-self: end;
    }

    .nuclide-proton {
      grid-row: 2;
      align-self: start;
    }

    .nuclide-symbol {
      grid-column: 2;
      grid-row: 1 / 3;
      font-size: 76px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .answer-box.calculation-box {
      display: grid;
      gap: 9px;
      padding: 18px 20px;
      font-family: "Cambria Math", "Baskerville", Georgia, serif;
      font-size: 22px;
      line-height: 1.24;
      white-space: normal;
    }

    .answer-box.compact-answer {
      padding: 20px 24px;
      font-size: 24px;
      line-height: 1.34;
    }

    .answer-box.procedure-answer {
      padding: 19px 22px;
      font-family: "Aptos", "Trebuchet MS", sans-serif;
      font-size: 21px;
      font-weight: 720;
      line-height: 1.35;
    }

    .answer-card.has-answer-image {
      gap: 14px;
    }

    .answer-card.has-answer-image .answer-box {
      padding: 18px 22px;
      font-size: 23px;
      line-height: 1.3;
    }

    .answer-card.has-answer-image .answer-image-wrap {
      height: 160px;
    }

    .answer-card.has-answer-image .explanation-box {
      padding: 17px 20px;
      font-size: 18px;
      line-height: 1.48;
    }

    .calculation-line {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: baseline;
      gap: 12px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(85,75,179,.15);
    }

    .calculation-line.current-step {
      border: 1px solid rgba(40,103,122,.38);
      border-radius: 11px;
      background: #f7fbfa;
      box-shadow: 0 8px 20px rgba(18,61,73,.08);
    }

    .calculation-line.pending-step {
      border-style: dashed;
      background: linear-gradient(90deg, #f7fbfa, #eef5f3);
    }

    .calculation-expression.reveal-prompt {
      color: var(--muted);
      font-family: "Aptos", "Trebuchet MS", sans-serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 750;
      letter-spacing: .2px;
    }

    .calculation-line:last-child {
      border-bottom: 0;
    }

    .calculation-label {
      color: var(--indigo-2);
      font-family: "Aptos", "Trebuchet MS", sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .55px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .calculation-expression {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .calculation-line.final {
      border: 1px solid #e4c16b;
      border-radius: 11px;
      background: var(--amber-soft);
      color: #4b3512;
      font-weight: 850;
    }

    .calculation-line.final .calculation-label {
      color: #966316;
    }

    .answer-image-wrap {
      position: relative;
      display: grid;
      place-items: center;
      height: 190px;
      padding: 10px;
      border: 1px solid #ddd8e6;
      border-radius: 15px;
      background: white;
      cursor: zoom-in;
      overflow: hidden;
    }

    .answer-image-wrap::after {
      content: "Click to view full image";
      position: absolute;
      right: 10px;
      bottom: 9px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(44,40,100,.9);
      color: white;
      font-family: "Aptos", "Trebuchet MS", sans-serif;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .35px;
    }

    .answer-image {
      position: absolute;
      inset: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      max-width: none;
      max-height: none;
      object-fit: contain;
    }

    .image-lightbox {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: grid;
      grid-template-rows: 74px 1fr;
      padding: 24px 30px 30px;
      background: rgba(20,18,47,.96);
      animation: reveal .2s ease-out both;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: white;
    }

    .lightbox-bar strong {
      font-family: "Baskerville", Georgia, serif;
      font-size: 28px;
    }

    .lightbox-close {
      min-width: 130px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 14px;
      background: var(--amber);
      color: #221f46;
      cursor: pointer;
      font-weight: 900;
    }

    .lightbox-frame {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 22px;
      background: white;
      overflow: auto;
    }

    .lightbox-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .explanation-box {
      padding: 22px 25px;
      border-radius: 16px;
      background: var(--amber-soft);
      border: 1px solid #ead196;
      color: #4d3a18;
      font-size: 21px;
      font-weight: 650;
      line-height: 1.58;
      animation: reveal .26s ease-out both;
    }

    .explanation-box::before {
      content: "中文解釋";
      display: block;
      margin-bottom: 8px;
      color: #9a6617;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .complete-card {
      text-align: center;
      padding: 42px;
      border-radius: 24px;
      background: var(--indigo);
      color: white;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.08);
    }

    .complete-card strong {
      display: block;
      font-family: "Baskerville", Georgia, serif;
      font-size: 38px;
      margin-bottom: 12px;
    }

    .complete-card span {
      color: #e2def2;
      font-size: 19px;
    }

    .teacher-note {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: 13px;
      padding: 15px 22px;
      background: #f5f0e5;
      border-top: 1px solid var(--line);
      color: #6d6980;
      font-size: 16px;
      line-height: 1.42;
      overflow: hidden;
    }

    .teacher-note strong {
      color: var(--danger);
      white-space: nowrap;
    }

    .footer {
      display: grid;
      grid-template-columns: 270px 1fr 270px;
      align-items: center;
      gap: 16px;
      padding: 10px 28px;
      background: #e8e3d8;
      border-top: 1px solid #d0ccbf;
    }

    .nav-group {
      display: flex;
      gap: 10px;
    }

    .nav-group:last-child { justify-content: flex-end; }

    .nav-button {
      height: 48px;
      min-width: 122px;
      padding: 0 18px;
      border-radius: 14px;
      background: var(--indigo);
      color: white;
      font-weight: 850;
      font-size: 17px;
    }

    .nav-button.secondary {
      background: #fffdf8;
      color: var(--indigo);
      border: 1px solid #ccc7d8;
    }

    .nav-button:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
    }

    .question-strip {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .question-chip {
      width: 47px;
      height: 47px;
      border-radius: 14px;
      background: #f9f6ef;
      color: var(--indigo);
      border: 1px solid #d6d1df;
      font-size: 17px;
      font-weight: 900;
    }

    .question-chip.has-progress {
      box-shadow: inset 0 -5px 0 var(--indigo-2);
    }

    .question-chip.active {
      background: var(--amber);
      border-color: var(--amber);
      color: #221f46;
      box-shadow: none;
    }

    .screen-hint {
      position: absolute;
      right: 18px;
      top: 17px;
      color: #9993ac;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .source-warning {
      color: #7c3428;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage" aria-live="polite"></main>
  </div>

  <script src="questions.js"></script>
  <script>
    "use strict";

    const QUESTIONS = window.TERENGGANU_QUESTIONS;
    const STORAGE_KEY = "gregos-k2-terengganu-teacher-v1";

    class SlidePresentation {
      constructor(stage, questions) {
        this.stage = stage;
        this.questions = questions;
        this.current = 0;
        this.pageIndexes = questions.map(function () { return 0; });
        this.reveals = questions.map(function () {
          return { segment: -1, mode: "idle", calcStep: -1, calcPhase: "label" };
        });
        this.paperModes = questions.map(function () { return "width"; });
        this.paperZooms = questions.map(function () { return 1; });
        this.scrollPositions = questions.map(function (question) {
          return question.pages.map(function () { return { top: 0, left: 0 }; });
        });
        this.progressSyncReady = false;
        this.pointerStart = null;
        this.paperDrag = null;
        this.load();
        this.render();
        this.scale();
        this.bind();
      }

      load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved) return;
          if (Number.isInteger(saved.current)) {
            this.current = Math.max(0, Math.min(this.questions.length - 1, saved.current));
          }
          if (Array.isArray(saved.pageIndexes)) {
            this.pageIndexes = this.questions.map(function (q, index) {
              const value = Number(saved.pageIndexes[index]);
              return Number.isInteger(value) ? Math.max(0, Math.min(q.pages.length - 1, value)) : 0;
            });
          }
          if (Array.isArray(saved.reveals)) {
            this.reveals = this.questions.map(function (q, index) {
              const value = saved.reveals[index] || {};
              const segment = Number.isInteger(value.segment)
                ? Math.max(-1, Math.min(q.segments.length - 1, value.segment))
                : -1;
              const allowed = ["idle", "answer", "calculation", "explanation", "complete"];
              let mode = allowed.includes(value.mode) ? value.mode : "idle";
              let calcStep = -1;
              let calcPhase = value.calcPhase === "value" ? "value" : "label";
              const segmentData = segment >= 0 ? q.segments[segment] : null;
              if (segmentData && segmentData.calculation) {
                const lineCount = segmentData.answer.split("\n").filter(Boolean).length;
                if (mode === "answer") {
                  mode = "calculation";
                  calcStep = 0;
                  calcPhase = "label";
                } else if (mode === "calculation") {
                  const savedStep = Number(value.calcStep);
                  calcStep = Number.isInteger(savedStep)
                    ? Math.max(0, Math.min(lineCount - 1, savedStep))
                    : 0;
                } else if (mode === "explanation" || mode === "complete") {
                  calcStep = lineCount - 1;
                  calcPhase = "value";
                }
              }
              return {
                segment: segment,
                mode: segment < 0 ? "idle" : mode,
                calcStep: calcStep,
                calcPhase: calcPhase
              };
            });
          }
          if (Array.isArray(saved.paperModes)) {
            this.paperModes = this.questions.map(function (_, index) {
              return saved.paperModes[index] === "page" ? "page" : "width";
            });
          }
          if (Array.isArray(saved.paperZooms)) {
            this.paperZooms = this.questions.map(function (_, index) {
              const value = Number(saved.paperZooms[index]);
              return Number.isFinite(value) ? Math.max(0.7, Math.min(2, value)) : 1;
            });
          }
          if (Array.isArray(saved.scrollPositions)) {
            this.scrollPositions = this.questions.map(function (question, questionIndex) {
              const savedQuestion = saved.scrollPositions[questionIndex] || [];
              return question.pages.map(function (_, pageIndex) {
                const value = savedQuestion[pageIndex] || {};
                return {
                  top: Math.max(0, Number(value.top) || 0),
                  left: Math.max(0, Number(value.left) || 0)
                };
              });
            });
          }
        } catch (error) {
          console.warn("Saved teacher progress could not be loaded.", error);
        }
      }

      save() {
        const snapshot = {
          current: this.current,
          pageIndexes: this.pageIndexes,
          reveals: this.reveals,
          paperModes: this.paperModes,
          paperZooms: this.paperZooms,
          scrollPositions: this.scrollPositions,
          revealedQuestions: this.reveals.filter(function (item) { return item.mode !== "idle"; }).length,
          completedQuestions: this.reveals.filter(function (item) { return item.mode === "complete"; }).length
        };
        snapshot.completion = Math.round(snapshot.completedQuestions / this.questions.length * 100);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        if (this.progressSyncReady && window.ProgressTracker?.autoSave) {
          ProgressTracker.autoSave(snapshot, 1200);
        }
      }

      restoreRemoteProgress(saved) {
        if (!saved || typeof saved !== "object") return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        this.load();
        this.render();
      }

      scale() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const left = (window.innerWidth - 1920 * scale) / 2;
        const top = (window.innerHeight - 1080 * scale) / 2;
        this.stage.style.transform = "translate(" + left + "px, " + top + "px) scale(" + scale + ")";
      }

      bind() {
        window.addEventListener("resize", this.scale.bind(this));
        document.addEventListener("keydown", this.onKey.bind(this));
        this.stage.addEventListener("pointerdown", this.onPointerDown.bind(this));
        this.stage.addEventListener("pointermove", this.onPointerMove.bind(this));
        this.stage.addEventListener("pointerup", this.onPointerUp.bind(this));
        this.stage.addEventListener("pointercancel", this.onPointerCancel.bind(this));
      }

      onKey(event) {
        const lightbox = this.stage.querySelector(".image-lightbox");
        if (lightbox) {
          if (event.key === "Escape" || event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            lightbox.remove();
          }
          return;
        }
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          this.advanceReveal();
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
          event.preventDefault();
          this.go(this.current + 1);
        } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          this.go(this.current - 1);
        } else if (event.key === "]") {
          event.preventDefault();
          this.changeSourcePage(1);
        } else if (event.key === "[") {
          event.preventDefault();
          this.changeSourcePage(-1);
        } else if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          this.changePaperZoom(0.15);
        } else if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          this.changePaperZoom(-0.15);
        } else if (event.key === "0") {
          event.preventDefault();
          this.fitPaperWidth();
        } else if (event.key === "Home") {
          event.preventDefault();
          this.scrollPaperTop();
        } else if (event.key.toLowerCase() === "r" && event.shiftKey) {
          event.preventDefault();
          this.resetAll();
        } else if (event.key.toLowerCase() === "r") {
          event.preventDefault();
          this.resetCurrent();
        } else if (event.key.toLowerCase() === "f") {
          event.preventDefault();
          this.toggleFullscreen();
        }
      }

      onPointerDown(event) {
        if (event.target.closest("button, .answer-image-wrap, .image-lightbox")) return;
        this.pointerStart = { x: event.clientX, y: event.clientY };
        const paperView = event.target.closest(".paper-view");
        if (paperView) {
          this.paperDrag = {
            view: paperView,
            x: event.clientX,
            y: event.clientY,
            left: paperView.scrollLeft,
            top: paperView.scrollTop,
            moved: false
          };
          paperView.classList.add("dragging");
          paperView.setPointerCapture(event.pointerId);
        }
      }

      onPointerMove(event) {
        if (!this.paperDrag) return;
        const dx = event.clientX - this.paperDrag.x;
        const dy = event.clientY - this.paperDrag.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this.paperDrag.moved = true;
        if (!this.paperDrag.moved) return;
        this.paperDrag.view.scrollLeft = this.paperDrag.left - dx;
        this.paperDrag.view.scrollTop = this.paperDrag.top - dy;
        event.preventDefault();
      }

      onPointerUp(event) {
        if (this.paperDrag) {
          const moved = this.paperDrag.moved;
          this.paperDrag.view.classList.remove("dragging");
          this.rememberPaperPosition();
          this.paperDrag = null;
          if (moved) {
            this.pointerStart = null;
            this.save();
            return;
          }
        }
        if (!this.pointerStart || event.target.closest("button, .answer-image-wrap, .image-lightbox")) {
          this.pointerStart = null;
          return;
        }
        const dx = event.clientX - this.pointerStart.x;
        const dy = event.clientY - this.pointerStart.y;
        this.pointerStart = null;
        if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          this.go(this.current + (dx < 0 ? 1 : -1));
          return;
        }
        if (Math.abs(dx) < 14 && Math.abs(dy) < 14) this.advanceReveal();
      }

      onPointerCancel() {
        if (this.paperDrag) this.paperDrag.view.classList.remove("dragging");
        this.paperDrag = null;
        this.pointerStart = null;
      }

      currentPaperState() {
        return this.scrollPositions[this.current][this.pageIndexes[this.current]];
      }

      rememberPaperPosition() {
        const paperView = this.stage.querySelector(".paper-view");
        if (!paperView) return;
        const state = this.currentPaperState();
        state.top = paperView.scrollTop;
        state.left = paperView.scrollLeft;
      }

      restorePaperPosition(paperView, paperImage) {
        const state = this.currentPaperState();
        const top = state.top;
        const left = state.left;
        const restore = function () {
          paperView.scrollTop = top;
          paperView.scrollLeft = left;
        };
        requestAnimationFrame(restore);
        if (!paperImage.complete) paperImage.addEventListener("load", restore, { once: true });
      }

      go(index) {
        const next = Math.max(0, Math.min(this.questions.length - 1, index));
        if (next === this.current) return;
        this.rememberPaperPosition();
        const oldPage = this.questions[this.current].pages[this.pageIndexes[this.current]];
        const oldState = this.currentPaperState();
        const nextPageIndex = this.pageIndexes[next];
        const nextPage = this.questions[next].pages[nextPageIndex];
        this.current = next;
        const nextState = this.currentPaperState();
        if (oldPage === nextPage) {
          nextState.top = oldState.top;
          nextState.left = oldState.left;
        } else {
          nextState.top = 0;
          nextState.left = 0;
        }
        this.save();
        this.render();
      }

      changeSourcePage(direction) {
        const q = this.questions[this.current];
        const next = Math.max(0, Math.min(q.pages.length - 1, this.pageIndexes[this.current] + direction));
        if (next === this.pageIndexes[this.current]) return;
        this.rememberPaperPosition();
        this.pageIndexes[this.current] = next;
        this.currentPaperState().top = 0;
        this.currentPaperState().left = 0;
        this.save();
        this.render();
      }

      setSourcePage(index) {
        const q = this.questions[this.current];
        const next = Math.max(0, Math.min(q.pages.length - 1, index));
        if (next === this.pageIndexes[this.current]) return;
        this.rememberPaperPosition();
        this.pageIndexes[this.current] = next;
        this.currentPaperState().top = 0;
        this.currentPaperState().left = 0;
        this.save();
        this.render();
      }

      changePaperZoom(delta) {
        this.rememberPaperPosition();
        const oldZoom = this.paperZooms[this.current];
        const nextZoom = Math.max(0.7, Math.min(2, Math.round((oldZoom + delta) * 100) / 100));
        if (nextZoom === oldZoom && this.paperModes[this.current] === "width") return;
        const state = this.currentPaperState();
        const ratio = nextZoom / oldZoom;
        state.top *= ratio;
        state.left *= ratio;
        this.paperModes[this.current] = "width";
        this.paperZooms[this.current] = nextZoom;
        this.save();
        this.render();
      }

      fitPaperWidth() {
        this.rememberPaperPosition();
        this.paperModes[this.current] = "width";
        this.paperZooms[this.current] = 1;
        this.save();
        this.render();
      }

      fitPaperPage() {
        this.paperModes[this.current] = "page";
        this.currentPaperState().top = 0;
        this.currentPaperState().left = 0;
        this.save();
        this.render();
      }

      scrollPaperTop() {
        const paperView = this.stage.querySelector(".paper-view");
        if (!paperView) return;
        paperView.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        const state = this.currentPaperState();
        state.top = 0;
        state.left = 0;
        this.save();
      }

      advanceReveal() {
        this.rememberPaperPosition();
        const state = this.reveals[this.current];
        const question = this.questions[this.current];
        const total = question.segments.length;
        if (state.mode === "idle") {
          this.startSegment(state, 0);
        } else if (state.mode === "calculation") {
          const lines = this.getCalculationLines(question.segments[state.segment]);
          if (state.calcPhase === "label") {
            state.calcPhase = "value";
          } else if (state.calcStep < lines.length - 1) {
            state.calcStep += 1;
            state.calcPhase = "label";
          } else {
            state.mode = "explanation";
          }
        } else if (state.mode === "answer") {
          state.mode = "explanation";
        } else if (state.mode === "explanation") {
          if (state.segment < total - 1) {
            this.startSegment(state, state.segment + 1);
          } else {
            state.mode = "complete";
          }
        }
        this.save();
        this.render();
      }

      startSegment(state, index) {
        const segment = this.questions[this.current].segments[index];
        state.segment = index;
        state.calcStep = segment.calculation ? 0 : -1;
        state.calcPhase = "label";
        state.mode = segment.calculation ? "calculation" : "answer";
      }

      getCalculationLines(segment) {
        return segment.answer.split("\n").filter(Boolean).map(function (line) {
          const match = line.match(/^(Step \d+|Final answer):\s*(.*)$/);
          return {
            label: match ? match[1] : "Working",
            expression: match ? match[2] : line,
            final: Boolean(match && match[1] === "Final answer")
          };
        });
      }

      resetCurrent() {
        this.rememberPaperPosition();
        this.reveals[this.current] = { segment: -1, mode: "idle", calcStep: -1, calcPhase: "label" };
        this.save();
        this.render();
      }

      resetAll() {
        const accepted = window.confirm("Reset every revealed answer for all 11 questions?");
        if (!accepted) return;
        this.reveals = this.questions.map(function () {
          return { segment: -1, mode: "idle", calcStep: -1, calcPhase: "label" };
        });
        this.pageIndexes = this.questions.map(function () { return 0; });
        this.paperModes = this.questions.map(function () { return "width"; });
        this.paperZooms = this.questions.map(function () { return 1; });
        this.scrollPositions = this.questions.map(function (question) {
          return question.pages.map(function () { return { top: 0, left: 0 }; });
        });
        this.current = 0;
        localStorage.removeItem(STORAGE_KEY);
        this.render();
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function () {});
        } else {
          document.exitFullscreen().catch(function () {});
        }
      }

      makeButton(label, className, handler, disabled, title) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.disabled = Boolean(disabled);
        if (title) button.title = title;
        button.addEventListener("click", function (event) {
          event.stopPropagation();
          handler();
        });
        return button;
      }

      openAnswerImage(source, altText) {
        const existing = this.stage.querySelector(".image-lightbox");
        if (existing) existing.remove();
        const overlay = document.createElement("div");
        overlay.className = "image-lightbox";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-label", "Full marking-scheme image");
        const bar = document.createElement("div");
        bar.className = "lightbox-bar";
        const title = document.createElement("strong");
        title.textContent = "Original marking-scheme image";
        const close = document.createElement("button");
        close.type = "button";
        close.className = "lightbox-close";
        close.textContent = "Close ×";
        close.addEventListener("click", function (event) {
          event.stopPropagation();
          overlay.remove();
        });
        bar.append(title, close);
        const frame = document.createElement("div");
        frame.className = "lightbox-frame";
        const image = document.createElement("img");
        image.className = "lightbox-image";
        image.src = source;
        image.alt = altText || "Original answer image from the supplied marking scheme";
        frame.append(image);
        overlay.append(bar, frame);
        overlay.addEventListener("click", function (event) {
          event.stopPropagation();
          if (event.target === overlay) overlay.remove();
        });
        this.stage.append(overlay);
        close.focus();
      }

      renderReveal(container, q, state) {
        container.replaceChildren();
        if (state.mode === "idle") {
          const card = document.createElement("div");
          card.className = "idle-card";
          const icon = document.createElement("div");
          icon.className = "idle-icon";
          icon.textContent = "→";
          const strong = document.createElement("strong");
          strong.textContent = "Click to reveal the answer";
          const span = document.createElement("span");
          span.textContent = "Answer in English · Explanation in Chinese";
          card.append(icon, strong, span);
          container.append(card);
          return;
        }

        if (state.mode === "complete") {
          const card = document.createElement("div");
          card.className = "complete-card";
          const strong = document.createElement("strong");
          strong.textContent = "Question completed";
          const span = document.createElement("span");
          span.textContent = "Press R or use Reset Question to teach it again.";
          card.append(strong, span);
          container.append(card);
          return;
        }

        const segment = q.segments[state.segment];
        const card = document.createElement("div");
        card.className = "answer-card";
        if (segment.image) card.classList.add("has-answer-image");
        const kicker = document.createElement("div");
        kicker.className = "part-kicker";
        kicker.textContent = segment.label;
        const answer = document.createElement("div");
        answer.className = "answer-box";
        if (segment.layout === "compact") answer.classList.add("compact-answer");
        if (segment.layout === "procedure") answer.classList.add("procedure-answer");
        if (segment.nuclide) {
          answer.classList.add("nuclide-answer");
          const notation = document.createElement("span");
          notation.className = "nuclide-notation";
          notation.setAttribute(
            "aria-label",
            `${segment.nuclide.symbol}-${segment.nuclide.mass}, proton number ${segment.nuclide.proton}`
          );
          const mass = document.createElement("span");
          mass.className = "nuclide-mass";
          mass.textContent = segment.nuclide.mass;
          const proton = document.createElement("span");
          proton.className = "nuclide-proton";
          proton.textContent = segment.nuclide.proton;
          const symbol = document.createElement("span");
          symbol.className = "nuclide-symbol";
          symbol.textContent = segment.nuclide.symbol;
          notation.append(mass, proton, symbol);
          answer.append(notation);
        } else if (segment.calculation) {
          answer.classList.add("calculation-box");
          const lines = this.getCalculationLines(segment);
          const visibleStep = state.mode === "explanation" ? lines.length - 1 : state.calcStep;
          lines.slice(0, visibleStep + 1).forEach(function (line, index) {
            const isCurrent = index === visibleStep && state.mode === "calculation";
            const showExpression = state.mode === "explanation" || index < visibleStep || state.calcPhase === "value";
            const row = document.createElement("div");
            row.className = "calculation-line" +
              (line.final ? " final" : "") +
              (isCurrent ? " current-step" : "") +
              (isCurrent && !showExpression ? " pending-step" : "");
            const label = document.createElement("span");
            label.className = "calculation-label";
            label.textContent = line.label;
            const expression = document.createElement("span");
            expression.className = "calculation-expression" + (!showExpression ? " reveal-prompt" : "");
            expression.textContent = showExpression ? line.expression : "Click again to reveal this step";
            row.append(label, expression);
            answer.append(row);
          });
        } else {
          answer.textContent = segment.answer;
        }
        card.append(kicker, answer);

        if (segment.image) {
          const imageWrap = document.createElement("div");
          imageWrap.className = "answer-image-wrap";
          imageWrap.tabIndex = 0;
          imageWrap.setAttribute("role", "button");
          imageWrap.setAttribute("aria-label", "Open the full marking-scheme image");
          imageWrap.title = "Click to view the complete marking-scheme image";
          const image = document.createElement("img");
          image.className = "answer-image";
          image.src = segment.image;
          image.alt = segment.imageAlt || "Answer image from the supplied marking scheme";
          imageWrap.addEventListener("click", function (event) {
            event.stopPropagation();
            this.openAnswerImage(segment.image, image.alt);
          }.bind(this));
          imageWrap.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              event.stopPropagation();
              this.openAnswerImage(segment.image, image.alt);
            }
          }.bind(this));
          imageWrap.append(image);
          card.append(imageWrap);
        }

        if (state.mode === "explanation") {
          const explanation = document.createElement("div");
          explanation.className = "explanation-box";
          explanation.textContent = segment.explanation;
          card.append(explanation);
        }
        container.append(card);
        if (segment.calculation && state.mode === "calculation") {
          requestAnimationFrame(function () {
            const currentStep = container.querySelector(".calculation-line.current-step");
            if (currentStep) currentStep.scrollIntoView({ block: "nearest" });
          });
        }
      }

      render() {
        const q = this.questions[this.current];
        const state = this.reveals[this.current];
        const currentPageIndex = this.pageIndexes[this.current];
        const sourcePage = q.pages[currentPageIndex];

        const slide = document.createElement("section");
        slide.className = "slide active";
        slide.setAttribute("aria-label", "Question " + q.number);

        const shell = document.createElement("div");
        shell.className = "slide-shell";

        const topbar = document.createElement("header");
        topbar.className = "topbar";
        const brand = document.createElement("div");
        brand.className = "brand";
        const crest = document.createElement("div");
        crest.className = "crest";
        crest.textContent = "K2";
        const brandCopy = document.createElement("div");
        brandCopy.className = "brand-copy";
        const brandStrong = document.createElement("strong");
        brandStrong.textContent = "SPM Chemistry · Terengganu";
        const brandSpan = document.createElement("span");
        brandSpan.textContent = "Teacher-controlled answer deck";
        brandCopy.append(brandStrong, brandSpan);
        brand.append(crest, brandCopy);

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = q.section + " · Question " + q.number;

        const actions = document.createElement("div");
        actions.className = "top-actions";
        const backLink = document.createElement("a");
        backLink.href = "../../../../../index.html";
        backLink.className = "back-link";
        backLink.textContent = "Portal";
        actions.append(
          backLink,
          this.makeButton("Reset Question", "icon-button", this.resetCurrent.bind(this), false, "Keyboard: R"),
          this.makeButton("Reset All", "icon-button reset-all", this.resetAll.bind(this), false, "Keyboard: Shift+R"),
          this.makeButton("Fullscreen", "icon-button", this.toggleFullscreen.bind(this), false, "Keyboard: F")
        );
        topbar.append(brand, title, actions);

        const workspace = document.createElement("div");
        workspace.className = "workspace";

        const paperPanel = document.createElement("section");
        paperPanel.className = "paper-panel";
        const paperHeading = document.createElement("div");
        paperHeading.className = "panel-heading";
        const paperTitle = document.createElement("h2");
        paperTitle.textContent = "Original question paper · drag / wheel to move";
        const sourceLabel = document.createElement("span");
        sourceLabel.className = "source-label";
        sourceLabel.textContent = "PDF page " + sourcePage + " of 26";
        const pdfTools = document.createElement("div");
        pdfTools.className = "pdf-tools";
        const zoomReadout = document.createElement("span");
        zoomReadout.className = "pdf-tool zoom-readout";
        zoomReadout.textContent = this.paperModes[this.current] === "page"
          ? "PAGE"
          : Math.round(this.paperZooms[this.current] * 100) + "%";
        pdfTools.append(
          this.makeButton("−", "pdf-tool", this.changePaperZoom.bind(this, -0.15), false, "Zoom out (−)"),
          zoomReadout,
          this.makeButton("+", "pdf-tool", this.changePaperZoom.bind(this, 0.15), false, "Zoom in (+)"),
          this.makeButton(
            "Fit Width",
            "pdf-tool" + (this.paperModes[this.current] === "width" && this.paperZooms[this.current] === 1 ? " active" : ""),
            this.fitPaperWidth.bind(this),
            false,
            "Fit page width (0)"
          ),
          this.makeButton(
            "Fit Page",
            "pdf-tool" + (this.paperModes[this.current] === "page" ? " active" : ""),
            this.fitPaperPage.bind(this),
            false,
            "Show the whole page"
          ),
          this.makeButton("Top ↑", "pdf-tool", this.scrollPaperTop.bind(this), false, "Return to top (Home)")
        );
        paperHeading.append(paperTitle, pdfTools, sourceLabel);

        const paperView = document.createElement("div");
        paperView.className = "paper-view";
        const paperImage = document.createElement("img");
        paperImage.className = "paper-page" + (this.paperModes[this.current] === "page" ? " fit-page" : "");
        if (this.paperModes[this.current] === "width") {
          paperImage.style.width = Math.round(this.paperZooms[this.current] * 100) + "%";
        }
        paperImage.src = "assets/questions/page-" + String(sourcePage).padStart(2, "0") + ".jpg";
        paperImage.alt = "Original PDF page " + sourcePage + " for Question " + q.number;
        paperImage.draggable = false;
        paperView.addEventListener("scroll", function () {
          const position = this.currentPaperState();
          position.top = paperView.scrollTop;
          position.left = paperView.scrollLeft;
          window.clearTimeout(this.scrollSaveTimer);
          this.scrollSaveTimer = window.setTimeout(this.save.bind(this), 180);
        }.bind(this), { passive: true });
        paperView.append(paperImage);

        const pageStrip = document.createElement("div");
        pageStrip.className = "page-strip";
        q.pages.forEach(function (pageNumber, index) {
          const chip = this.makeButton(
            "PDF " + pageNumber,
            "page-chip" + (index === currentPageIndex ? " active" : ""),
            this.setSourcePage.bind(this, index),
            false,
            "Keyboard: [ and ]"
          );
          pageStrip.append(chip);
        }, this);
        paperPanel.append(paperHeading, paperView, pageStrip);

        const answerPanel = document.createElement("section");
        answerPanel.className = "answer-panel";
        const answerHeading = document.createElement("div");
        answerHeading.className = "answer-heading";
        const answerTitle = document.createElement("h2");
        answerTitle.textContent = "Teacher Answer";
        const marks = document.createElement("span");
        marks.className = "marks";
        marks.textContent = q.marks;
        answerHeading.append(answerTitle, marks);

        const progress = document.createElement("div");
        progress.className = "progress-row";
        q.segments.forEach(function (_, index) {
          const dot = document.createElement("span");
          dot.className = "progress-dot";
          if (state.mode === "complete" || index < state.segment) dot.classList.add("done");
          if (index === state.segment && state.mode !== "idle" && state.mode !== "complete") dot.classList.add("current");
          progress.append(dot);
        });

        const reveal = document.createElement("div");
        reveal.className = "reveal-stage";
        const hint = document.createElement("div");
        hint.className = "screen-hint";
        if (state.mode === "calculation") {
          hint.textContent = state.calcPhase === "label"
            ? "CLICK / SPACE: REVEAL THIS STEP"
            : "CLICK / SPACE: SHOW NEXT STEP";
        } else if (state.mode === "answer") {
          hint.textContent = "CLICK / SPACE: EXPLAIN";
        } else if (state.mode === "explanation") {
          hint.textContent = "CLICK / SPACE: NEXT PART";
        } else {
          hint.textContent = "CLICK / SPACE: REVEAL";
        }
        reveal.append(hint);
        const revealContent = document.createElement("div");
        revealContent.style.display = "contents";
        reveal.append(revealContent);
        this.renderReveal(revealContent, q, state);

        const note = document.createElement("div");
        note.className = "teacher-note";
        const noteLabel = document.createElement("strong");
        noteLabel.textContent = q.note.startsWith("Source warning") ? "SOURCE NOTE" : "TEACHER NOTE";
        const noteText = document.createElement("span");
        noteText.textContent = q.note;
        if (q.note.startsWith("Source warning")) noteText.className = "source-warning";
        note.append(noteLabel, noteText);
        answerPanel.append(answerHeading, progress, reveal, note);

        workspace.append(paperPanel, answerPanel);

        const footer = document.createElement("footer");
        footer.className = "footer";
        const previousGroup = document.createElement("div");
        previousGroup.className = "nav-group";
        previousGroup.append(
          this.makeButton("← Previous", "nav-button secondary", this.go.bind(this, this.current - 1), this.current === 0, "Previous question")
        );

        const questionStrip = document.createElement("nav");
        questionStrip.className = "question-strip";
        questionStrip.setAttribute("aria-label", "Questions");
        this.questions.forEach(function (item, index) {
          const hasProgress = this.reveals[index].mode !== "idle";
          const classes = "question-chip" +
            (index === this.current ? " active" : "") +
            (hasProgress && index !== this.current ? " has-progress" : "");
          questionStrip.append(
            this.makeButton(String(item.number), classes, this.go.bind(this, index), false, "Question " + item.number)
          );
        }, this);

        const nextGroup = document.createElement("div");
        nextGroup.className = "nav-group";
        nextGroup.append(
          this.makeButton("Next →", "nav-button", this.go.bind(this, this.current + 1), this.current === this.questions.length - 1, "Next question")
        );
        footer.append(previousGroup, questionStrip, nextGroup);

        shell.append(topbar, workspace, footer);
        slide.append(shell);
        this.stage.replaceChildren(slide);
        this.restorePaperPosition(paperView, paperImage);
      }
    }

    window.teacherDeck = new SlidePresentation(document.getElementById("deckStage"), QUESTIONS);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../../../js/auth-access.js?v=1.2.0"></script>
  <script src="../../../../../js/navigation.js?v=1.0.0"></script>
  <script src="../../../../../js/progress-tracker.js?v=1.0.2"
    data-module-id="spm-chem-f5-terengganu-2025-k2-teacher"
    data-module-name="Terengganu 2025 Kimia Kertas 2 Teacher Slides"
    data-module-url="content/SPM_Syllabus/Form5/Chemistry/Terengganu_2025_Kertas_2_Teacher/index.html"></script>
  <script>
    if (window.ProgressTracker?.init) {
      ProgressTracker.init(async function (tracker) {
        const saved = await tracker.load();
        if (saved && typeof saved === "object") {
          window.teacherDeck.restoreRemoteProgress(saved);
        }
        window.teacherDeck.progressSyncReady = true;
      });
    }
  </script>
</body>
